[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "2.2.0"
description = "AURA — 5G & YZ ile Akıllı Yol Güvenliği (TEKNOFEST 2026) YZ çekirdeği ve servisleri"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AURA Team" }]

# NOT: torch/torchvision burada YOK — bootstrap.py backend'e göre (MPS/CUDA/CPU)
# doğru index'ten kurar. ultralytics/easyocr torch'u zaten kurulu bulur.
dependencies = [
  "ultralytics>=8.4.0",  # YOLO26 mimarisi 8.4.x ile gelir; 8.3.x yolo26 ağırlığını yükler ama düzgün inference yapamaz
  "opencv-python>=4.9",
  "easyocr>=1.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "websockets>=12.0",
  "sse-starlette>=2.0",
  "shapely>=2.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "rich>=13.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
core = []   # çekirdek bağımlılıklar zaten [project.dependencies] içinde
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "black>=24.0",
  "pre-commit>=3.7",
]

[project.scripts]
aura = "aura.__main__:main"

[tool.setuptools]
packages = { find = { include = ["aura*", "train*", "services*"] } }

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "weights", "data", "mobile", "eval_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]   # E501: black hallediyor; B008: FastAPI Depends pattern

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/(\\.venv|weights|data|mobile|eval_results)/"

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: gerçek model ağırlığı gerektiren testler (CI'da skip)",
]
addopts = "-q"
asyncio_mode = "auto"
